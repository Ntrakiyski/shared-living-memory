<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="500" viewBox="0 0 1200 500"
     role="img" aria-labelledby="title desc">
  <title id="title">Shared Living Memory</title>
  <desc id="desc">A shared memory layer that keeps decisions, client context, research, and AI findings available across a growing team with ownership, privacy, history, and citations.</desc>

  <defs>
    <pattern id="paper-lines" width="1200" height="42" patternUnits="userSpaceOnUse">
      <path d="M0 41.5H1200" stroke="#26241F" stroke-opacity=".035"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#B26641"/>
    </marker>
  </defs>

  <rect width="1200" height="500" rx="28" fill="#F4F1EA"/>
  <rect width="1200" height="500" rx="28" fill="url(#paper-lines)"/>
  <rect x="1" y="1" width="1198" height="498" rx="27" fill="none" stroke="#26241F" stroke-opacity=".10"/>

  <g transform="translate(64 50)">
    <text x="0" y="0" dominant-baseline="hanging"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" font-weight="700" letter-spacing="2.3" fill="#8A4E2F">
      SHARED CONTEXT FOR PEOPLE + AI
    </text>

    <text x="0" y="72"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="62" font-weight="600" letter-spacing="-1.8" fill="#26241F">
      Shared Living
    </text>
    <text x="0" y="132"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="62" font-weight="600" letter-spacing="-1.8" fill="#26241F">
      Memory
    </text>

    <text x="0" y="190"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="25" font-weight="700" fill="#26241F">
      Keep the whole team aligned without
    </text>
    <text x="0" y="223"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="25" font-weight="700" fill="#26241F">
      repeating the same context.
    </text>

    <text x="0" y="270"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18.5" fill="#6E6B62">
      Decisions, client knowledge, research, and operating know-how
    </text>
    <text x="0" y="298"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18.5" fill="#6E6B62">
      stay available across handoffs, onboarding, and every AI tool.
    </text>

    <g transform="translate(0 352)">
      <rect x="0" y="0" width="162" height="42" rx="21" fill="#FCFBF7" stroke="#D8D1C4"/>
      <circle cx="23" cy="21" r="6" fill="#B26641"/>
      <text x="39" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="15" font-weight="700" fill="#26241F">clear ownership</text>

      <rect x="176" y="0" width="178" height="42" rx="21" fill="#FCFBF7" stroke="#D8D1C4"/>
      <circle cx="199" cy="21" r="6" fill="#5B8A6B"/>
      <text x="215" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="15" font-weight="700" fill="#26241F">private by default</text>

      <rect x="368" y="0" width="178" height="42" rx="21" fill="#FCFBF7" stroke="#D8D1C4"/>
      <path d="M390 15h12v10h-12zM395 12h12v10" fill="none" stroke="#B26641" stroke-width="1.8"/>
      <text x="415" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="15" font-weight="700" fill="#26241F">history + evidence</text>
    </g>
  </g>

  <g transform="translate(680 48)">
    <text x="0" y="0" dominant-baseline="hanging"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="15" font-weight="700" letter-spacing="1.7" fill="#6E6B62">
      THE TEAM CREATES
    </text>

    <g transform="translate(0 38)">
      <rect width="208" height="60" rx="14" fill="#FCFBF7" stroke="#D8D1C4"/>
      <circle cx="26" cy="30" r="10" fill="#EAD9CE"/>
      <path d="M22 30l3 3 6-8" fill="none" stroke="#B26641" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="47" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="18" font-weight="700" fill="#26241F">Decisions + why</text>
    </g>

    <g transform="translate(228 38)">
      <rect width="208" height="60" rx="14" fill="#FCFBF7" stroke="#D8D1C4"/>
      <rect x="17" y="21" width="20" height="18" rx="3" fill="#EAD9CE"/>
      <path d="M21 25h12M21 30h9M21 35h11" stroke="#B26641" stroke-width="1.7" stroke-linecap="round"/>
      <text x="47" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="18" font-weight="700" fill="#26241F">Client context</text>
    </g>

    <g transform="translate(0 112)">
      <rect width="208" height="60" rx="14" fill="#FCFBF7" stroke="#D8D1C4"/>
      <circle cx="26" cy="27" r="9" fill="none" stroke="#5B8A6B" stroke-width="2"/>
      <path d="M32 34l7 7" stroke="#5B8A6B" stroke-width="2.2" stroke-linecap="round"/>
      <text x="47" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="18" font-weight="700" fill="#26241F">Research + sources</text>
    </g>

    <g transform="translate(228 112)">
      <rect width="208" height="60" rx="14" fill="#FCFBF7" stroke="#D8D1C4"/>
      <rect x="17" y="19" width="20" height="22" rx="5" fill="#E5EBE2"/>
      <path d="M22 25h10M22 30h10M22 35h7" stroke="#5B8A6B" stroke-width="1.8" stroke-linecap="round"/>
      <text x="47" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="18" font-weight="700" fill="#26241F">AI findings</text>
    </g>

    <path d="M218 174V210"
          fill="none" stroke="#B26641" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(0 214)">
      <rect width="436" height="104" rx="20" fill="#26241F"/>
      <circle cx="42" cy="42" r="20" fill="#3B3730"/>
      <path d="M31 44c7-17 19-17 27 0M34 50c6-11 15-11 21 0" fill="none" stroke="#D38A5E" stroke-width="2.2" stroke-linecap="round"/>
      <text x="76" y="43" font-family="Georgia, 'Times New Roman', serif"
            font-size="26" font-weight="600" fill="#FCFBF7">Shared memory layer</text>
      <text x="76" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="16" fill="#C8C1B4">owner · visibility · source · version history</text>
    </g>

    <path d="M218 318V342" stroke="#B26641" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="0" y="346" dominant-baseline="hanging"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="15" font-weight="700" letter-spacing="1.7" fill="#6E6B62">
      THE TEAM REUSES
    </text>

    <g transform="translate(0 378)">
      <rect width="136" height="62" rx="14" fill="#F1E4DB" stroke="#C99F86"/>
      <text x="68" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="17" font-weight="700" fill="#26241F">Faster</text>
      <text x="68" y="47" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="17" font-weight="700" fill="#26241F">onboarding</text>
    </g>
    <g transform="translate(150 378)">
      <rect width="136" height="62" rx="14" fill="#F1E4DB" stroke="#C99F86"/>
      <text x="68" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="17" font-weight="700" fill="#26241F">Clearer</text>
      <text x="68" y="47" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="17" font-weight="700" fill="#26241F">handoffs</text>
    </g>
    <g transform="translate(300 378)">
      <rect width="136" height="62" rx="14" fill="#F1E4DB" stroke="#C99F86"/>
      <text x="68" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="17" font-weight="700" fill="#26241F">Consistent</text>
      <text x="68" y="47" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="17" font-weight="700" fill="#26241F">answers</text>
    </g>
  </g>
</svg>
