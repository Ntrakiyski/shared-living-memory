<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="540" viewBox="0 0 1200 540"
     role="img" aria-labelledby="title desc">
  <title id="title">How Shared Living Memory works</title>
  <desc id="desc">Knowledge is captured during work, kept trustworthy with ownership and history, and reused by people and AI tools with its evidence attached.</desc>

  <defs>
    <pattern id="lines" width="1200" height="42" patternUnits="userSpaceOnUse">
      <path d="M0 41.5H1200" stroke="#26241F" stroke-opacity=".035"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#B26641"/>
    </marker>
  </defs>

  <rect width="1200" height="540" rx="28" fill="#F4F1EA"/>
  <rect width="1200" height="540" rx="28" fill="url(#lines)"/>
  <rect x="1" y="1" width="1198" height="538" rx="27" fill="none" stroke="#26241F" stroke-opacity=".10"/>

  <g transform="translate(60 42)">
    <text x="0" y="0" dominant-baseline="hanging"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" font-weight="700" letter-spacing="2.2" fill="#8A4E2F">
      HOW THE SHARED LAYER WORKS
    </text>
    <text x="0" y="66"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="43" font-weight="600" letter-spacing="-1.1" fill="#26241F">
      Turn everyday work into context the whole team can reuse.
    </text>
    <text x="0" y="104"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="19" fill="#6E6B62">
      Capture it once, keep the evidence attached, and bring it back inside the next task or handoff.
    </text>
  </g>

  <path d="M390 310H432" stroke="#B26641" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M765 310H807" stroke="#B26641" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g transform="translate(60 170)">
    <rect width="330" height="270" rx="20" fill="#FCFBF7" stroke="#D8D1C4"/>
    <text x="24" y="50" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="45" font-weight="700" fill="#E2DDD0">01</text>
    <circle cx="282" cy="40" r="19" fill="#EAD9CE"/>
    <path d="M271 40h22M282 29v22" stroke="#B26641" stroke-width="2.3" stroke-linecap="round"/>
    <text x="24" y="100" font-family="Georgia, 'Times New Roman', serif"
          font-size="28" font-weight="600" fill="#26241F">Capture during work</text>
    <text x="24" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#6E6B62">Save decisions, client context,</text>
    <text x="24" y="167" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#6E6B62">research, and AI findings as</text>
    <text x="24" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#6E6B62">the work is happening.</text>
    <rect x="24" y="222" width="282" height="30" rx="15" fill="#F1E4DB"/>
    <text x="165" y="243" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="14" font-weight="700" fill="#8A4E2F">DASHBOARD · MCP · REST</text>
  </g>

  <g transform="translate(435 170)">
    <rect width="330" height="270" rx="20" fill="#26241F"/>
    <text x="24" y="50" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="45" font-weight="700" fill="#555149">02</text>
    <rect x="263" y="21" width="43" height="43" rx="12" fill="#3A3731"/>
    <path d="M275 34h19v17h-19zM280 29h19v17" fill="none" stroke="#D38A5E" stroke-width="2.1"/>
    <text x="24" y="100" font-family="Georgia, 'Times New Roman', serif"
          font-size="28" font-weight="600" fill="#FCFBF7">Keep it trustworthy</text>
    <text x="24" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#C8C1B4">Preserve the owner, visibility,</text>
    <text x="24" y="167" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#C8C1B4">source, status, and history of</text>
    <text x="24" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#C8C1B4">every important item.</text>
    <rect x="24" y="222" width="282" height="30" rx="15" fill="#3A3731"/>
    <text x="165" y="243" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="14" font-weight="700" fill="#D38A5E">OWNER · PRIVACY · HISTORY</text>
  </g>

  <g transform="translate(810 170)">
    <rect width="330" height="270" rx="20" fill="#FCFBF7" stroke="#C99F86" stroke-width="1.5"/>
    <text x="24" y="50" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="45" font-weight="700" fill="#E2DDD0">03</text>
    <rect x="263" y="21" width="43" height="43" rx="12" fill="#F1E4DB"/>
    <path d="M275 42h18M284 33v18" stroke="#B26641" stroke-width="2.2" stroke-linecap="round"/>
    <text x="24" y="100" font-family="Georgia, 'Times New Roman', serif"
          font-size="28" font-weight="600" fill="#26241F">Reuse it in context</text>
    <text x="24" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#6E6B62">Ask from the dashboard or an</text>
    <text x="24" y="167" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#6E6B62">AI tool and receive the current</text>
    <text x="24" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#6E6B62">answer with evidence attached.</text>
    <rect x="24" y="222" width="282" height="30" rx="15" fill="#F1E4DB"/>
    <text x="165" y="243" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="14" font-weight="700" fill="#8A4E2F">ANSWER · SOURCE · CONTEXT</text>
  </g>

  <g transform="translate(60 474)">
    <rect width="1080" height="42" rx="21" fill="#ECE8DD"/>
    <circle cx="28" cy="21" r="7" fill="#B26641"/>
    <text x="47" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="17" font-weight="700" fill="#26241F">
      One decision can move across product, engineering, sales, and operations without losing the reason behind it.
    </text>
  </g>
</svg>
